<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuerpo y Palabra: Performance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent !important;
      font-family: 'Caveat', cursive;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      background-color: transparent !important;
    }
    .btn-ui {
      position: absolute;
      z-index: 10;
      padding: 8px 16px;
      font-size: 14px;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ui:hover {
      background: #fff;
      color: #000;
    }
    #start-btn { top: 20px; left: 20px; }
    #fullscreen-btn { top: 20px; right: 20px; }
  </style>
</head>
<body>
  <button id="start-btn" class="btn-ui">Iniciar Performance</button>
  <button id="fullscreen-btn" class="btn-ui">⛶ Pantalla Completa</button>
  <div id="canvas-container"></div>
  
  <script src="sketch.js"></script>
</body>
</html>
