<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuerpo y Palabra: Performance</title>
  
  <!-- Carga de la tipografía manuscrita (Caveat & Permanent Marker) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
  
  <!-- Librería p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Caveat', cursive;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    .btn-ui {
      position: absolute;
      z-index: 10;
      padding: 10px 18px;
      font-size: 16px;
      font-family: monospace;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: 2px solid #000;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-ui:hover {
      background: #000;
      color: #fff;
    }
    #start-btn {
      top: 20px;
      left: 20px;
    }
    #fullscreen-btn {
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <button id="start-btn" class="btn-ui">Iniciar Performance</button>
  <button id="fullscreen-btn" class="btn-ui">⛶ Pantalla Completa</button>
  <div id="canvas-container"></div>
  
  <script src="sketch.js"></script>
</body>
</html>
